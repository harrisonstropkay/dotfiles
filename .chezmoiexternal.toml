# tmux plugins — cloned into ~/.tmux/plugins on `chezmoi apply` / `chezmoi update`.
# These are NOT managed via TPM; ~/.tmux.conf loads each by explicit path.
# Tracks each repo's default branch; refreshed at most weekly (chezmoi pulls
# on apply once the period elapses, or immediately with `chezmoi apply --refresh-externals`).

[".tmux/plugins/tmux-resurrect"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-resurrect.git"
    refreshPeriod = "168h"

[".tmux/plugins/tmux-continuum"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tmux-continuum.git"
    refreshPeriod = "168h"

[".tmux/plugins/tmux-assistant-resurrect"]
    type = "git-repo"
    url = "https://github.com/timvw/tmux-assistant-resurrect.git"
    refreshPeriod = "168h"
