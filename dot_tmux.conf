# Mouse mode
set -g mouse on

# Change leader to Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Make the current window obvious
set -g window-status-current-style 'fg=black,bg=white,bold'

# Hide the right-hand status information
set -g status-right ''

# tmux-resurrect (save/restore sessions)
# Restore pane scrollback/output on restore
set -g @resurrect-capture-pane-contents 'on'
# Relaunch these programs on restore (~name = restore with full command line)
set -g @resurrect-processes 'ssh vim nvim less man tail top htop "~pi" "~codex" "~claude"'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
