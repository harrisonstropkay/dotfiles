# Mouse mode
set -g mouse on

# Change leader to Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Make the current window obvious
set -g window-status-current-style 'fg=black,bg=white,bold'

# Hide the right-hand status information
set -g status-right ''

# tmux-resurrect
set -g @resurrect-capture-pane-contents 'on'
# claude/pi/codex omitted on purpose — tmux-assistant-resurrect resumes them
set -g @resurrect-processes 'ssh vim nvim less man tail top htop'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

# tmux-assistant-resurrect (resume AI coding agents with history)
run-shell ~/.tmux/plugins/tmux-assistant-resurrect/tmux-assistant-resurrect.tmux

# tmux-continuum — must load last
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'
set -g status-right 'continuum: #{continuum_status} '
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
